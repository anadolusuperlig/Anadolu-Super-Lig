        .glass-panel {
            background: rgba(18, 19, 24, 0.85);

            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {

            transition: all 0.3s ease;

            border-color: rgba(214, 0, 28, 0.4);

        }
        .glow-red {

        }

        }

            width: 8px;

        }

        }
        ::-webkit-scrollbar-thumb {
            background: #232530;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
